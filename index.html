<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALGOVERSE 2026 · Technomyst · Second Year Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated background: code rain + moving grid + glow orbs -->
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="orb o1" aria-hidden="true"></div>
  <div class="orb o2" aria-hidden="true"></div>

  <!-- Header -->
  <header class="topbar">
    <div class="brand" id="brand">
      <span class="logo" aria-hidden="true">A</span>
      <h1 class="event-name">ALGOVERSE <span>2026</span></h1>
    </div>

    <div class="phase-pill"><i class="live-dot"></i><span id="headerPhase"></span></div>

    <div class="timer" id="timer" hidden>
      <svg class="t-ring" viewBox="0 0 40 40" aria-hidden="true">
        <circle class="t-bg" cx="20" cy="20" r="16"></circle>
        <circle class="t-fg" id="tRing" cx="20" cy="20" r="16"></circle>
      </svg>
      <span id="timeText">00:00</span>
    </div>
  </header>

  <main>
    <!-- ============ RULES / ENTRY ============ -->
    <section class="screen intro active" id="introScreen">
      <div class="term">
        <div class="term-bar">
          <span class="d d1"></span><span class="d d2"></span><span class="d d3"></span>
          <span class="term-title" id="termTitle">algoverse://rules</span>
        </div>

        <div class="term-body">
          <p class="prompt"><span class="pr">$</span> <span id="typed"></span><span class="caret"></span></p>

          <div class="chips">
            <span class="chip c-phase" id="cardPhase"></span>
            <span class="chip c-round" id="cardRound"></span>
          </div>

          <h2>Rules &amp; Instructions</h2>
          <p class="sub">Second Year Students &middot; Read carefully before you start</p>

          <div class="meta" id="metaRow"></div>

          <form class="student-details" id="studentDetails">
            <h3>Team details</h3>
            <label for="teamName">Team name</label>
            <input id="teamName" name="team_name" type="text" autocomplete="organization" maxlength="100" required />
            <label for="studentYear">Year</label>
            <input id="studentYear" name="year" type="text" value="2nd Year" readonly required />
            <label for="studentEmail">Email address</label>
            <input id="studentEmail" name="email" type="email" autocomplete="email" maxlength="254" required />
          </form>

          <ol class="rules" id="rulesList"></ol>

          <button class="btn-enter" id="enterBtn" type="button">
            <span class="btn-enter-in">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
              <span>Enter Quiz</span>
            </span>
          </button>
          <p class="hint">Your timer starts the moment you press <b>Enter Quiz</b>.</p>
        </div>
      </div>
    </section>

    <!-- ============ QUIZ ============ -->
    <section class="screen quiz" id="quizScreen">
      <div class="quiz-wrap">

        <nav class="tabs" id="tabs" aria-label="Sections"></nav>

        <div class="chip-row" id="chipRow" aria-label="Questions in this section"></div>

        <article class="q-card" id="qCard"></article>

        <div class="q-actions">
          <button class="btn b-ghost" id="prevBtn">&larr; Prev</button>
          <button class="btn b-ghost" id="nextBtn">Next &rarr;</button>
          <button class="btn b-flag" id="flagBtn">⚑ Flag</button>
          <button class="btn b-ghost" id="clearBtn">Clear</button>
          <button class="btn b-ghost" id="overviewBtn">▦ Overview</button>
          <button class="btn b-submit" id="submitBtn" hidden>Submit Test</button>
        </div>

        <div class="status">
          <div class="status-bar"><div id="progressBar"></div></div>
          <span><b id="answeredCount">0</b> / <b id="totalCount">0</b> answered</span>
        </div>
      </div>
    </section>

    <!-- ============ RESULT ============ -->
    <section class="screen result" id="resultScreen">
      <div class="score-card" id="resultCard"></div>
      <p class="submission-status" id="submissionStatus" role="status" aria-live="polite"></p>
    </section>
  </main>

  <!-- Overview modal -->
  <div class="modal" id="overviewModal" hidden>
    <div class="modal-box wide" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
      <div class="modal-head">
        <h3 id="ovTitle">Question Overview</h3>
        <button class="x" id="ovClose" aria-label="Close">✕</button>
      </div>
      <div id="ovBody"></div>
      <div class="legend">
        <span><i class="lg lg-ans"></i>Answered</span>
        <span><i class="lg lg-flag"></i>Flagged</span>
        <span><i class="lg lg-empty"></i>Not answered</span>
      </div>
    </div>
  </div>

  <!-- Confirm submit modal -->
  <div class="modal" id="confirmModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 id="confirmTitle">Submit your test?</h3>
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn b-ghost" id="reviewBtn">Go back &amp; review</button>
        <button class="btn b-submit" id="confirmSubmitBtn">Yes, submit</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
